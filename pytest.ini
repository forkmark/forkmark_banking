[pytest]
# Backstop against hangs: no single test may run longer than 120s. If one does,
# pytest-timeout dumps the stack of every thread and fails that test instead of
# wedging the whole run — so a deadlock is a visible, isolated failure rather than
# an indefinite hang. Requires pytest-timeout (see requirements-dev.txt); the
# option is ignored if the plugin is not installed.
timeout = 120
timeout_method = thread
testpaths = tests
